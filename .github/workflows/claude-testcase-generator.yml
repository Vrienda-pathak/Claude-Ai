name: Generate Test Cases for Code Changes
on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - develop

jobs:
  generate_tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Get changed files
      id: changed
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep -E '\.(py|js|ts|java|cpp|c|rb|go|php|rs)$' || echo "")
        else
          FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -E '\.(py|js|ts|java|cpp|c|rb|go|php|rs)$' || find . -name "*.py" -o -name "*.js" -o -name "*.ts" | head -3)
        fi

        if [ -z "$FILES" ]; then
          echo "No code files changed"
          echo "has_changes=false" >> $GITHUB_OUTPUT
        else
          echo "Changed files: $FILES"
          echo "has_changes=true" >> $GITHUB_OUTPUT
          {
            echo 'files<<EOF'
            echo "$FILES"
            echo 'EOF'
          } >> $GITHUB_OUTPUT
        fi

    - name: Read changed file contents
      id: content
      if: steps.changed.outputs.has_changes == 'true'
      run: |
        CONTENT=""
        echo "${{ steps.changed.outputs.files }}" | while IFS= read -r file; do
          if [ -n "$file" ] && [ -f "$file" ]; then
            echo "Reading file: $file"
            CONTENT="$CONTENT\n\n### File: $file\n$(cat "$file")"
          fi
        done

        {
          echo 'code<<EOF'
          echo -e "$CONTENT"
          echo 'EOF'
        } >> $GITHUB_OUTPUT

    - name: Call Claude API to generate test cases
      id: claude
      if: steps.changed.outputs.has_changes == 'true'
      run: |
        curl -s https://api.anthropic.com/v1/messages \
          -H "x-api-key: ${{ secrets.ANTHROPIC_API_KEY }}" \
          -H "anthropic-version: 2023-06-01" \
          -H "content-type: application/json" \
          -d "{
            \"model\": \"claude-sonnet-4-5-20250929\",
            \"max_tokens\": 4000,
            \"messages\": [
              {
                \"role\": \"user\",
                \"content\": \"Generate comprehensive unit test cases for the following code changes. Include test cases for normal functionality, edge cases, and error handling. Format as proper test code that can be executed:\\n\\n${{ steps.content.outputs.code }}\"
              }
            ]
          }" > response.json

        echo "Test cases generated for changed files"
        cat response.json

    - name: Upload test cases artifact
      uses: actions/upload-artifact@v4
      if: steps.changed.outputs.has_changes == 'true'
      with:
        name: generated-test-cases
        path: response.json
